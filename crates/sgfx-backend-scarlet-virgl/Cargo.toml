[package]
name = "sgfx-backend-scarlet-virgl"
version = "0.16.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/petitstrawberry/sgfx"

[features]
default = ["std"]
std = ["dep:scarlet-os", "gpu-raw/std"]
scarlet-std = ["dep:scarlet-std", "gpu-raw/scarlet-std"]

[dependencies]
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", branch = "dev", default-features = false, features = ["std"], optional = true }
scarlet-std = { git = "https://github.com/petitstrawberry/Scarlet", branch = "dev", optional = true }
gpu-raw = { git = "https://github.com/petitstrawberry/Scarlet", branch = "dev", default-features = false }
sgfx-core = { path = "../sgfx-core", default-features = false }
sgfx-codegen-virgl = { path = "../sgfx-codegen-virgl" }

[lib]
name = "sgfx_backend_scarlet_virgl"
path = "src/lib.rs"

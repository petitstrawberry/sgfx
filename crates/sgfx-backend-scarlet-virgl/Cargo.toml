[package]
name = "sgfx-backend-scarlet-virgl"
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/petitstrawberry/sgfx"

[features]
backend-abi = ["sgfx-core/backend-abi"]
default = ["std"]
std = ["dep:scarlet-os", "gpu-raw/std", "programmable"]
scarlet-std = ["dep:scarlet-std", "gpu-raw/scarlet-std"]
programmable = ["sgfx-codegen-virgl/programmable"]
profile-submissions = ["std"]

[dependencies]
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "97c99b0b3f2d651865a118500632f17725f7ecde", default-features = false, features = ["std"], optional = true }
scarlet-std = { git = "https://github.com/petitstrawberry/Scarlet", rev = "97c99b0b3f2d651865a118500632f17725f7ecde", optional = true }
gpu-raw = { git = "https://github.com/petitstrawberry/Scarlet", rev = "97c99b0b3f2d651865a118500632f17725f7ecde", default-features = false }
sgfx-codegen-virgl = { path = "../sgfx-codegen-virgl" }
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "77e64a81115d78fab7c63671c2a6c16aac060c05", default-features = false }

[lib]
name = "sgfx_backend_scarlet_virgl"
path = "src/lib.rs"

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in", "spv-out"] }

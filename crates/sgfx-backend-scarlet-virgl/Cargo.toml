[package]
name = "sgfx-backend-scarlet-virgl"
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/petitstrawberry/sgfx"

[features]
default = ["std"]
std = ["dep:scarlet-os", "gpu-raw/std", "programmable"]
scarlet-std = ["dep:scarlet-std", "gpu-raw/scarlet-std"]
programmable = ["sgfx-codegen-virgl/programmable"]

[dependencies]
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "85f0cead4cb4c9add021360f1b469f08bf0d23a9", default-features = false, features = ["std"], optional = true }
scarlet-std = { git = "https://github.com/petitstrawberry/Scarlet", rev = "85f0cead4cb4c9add021360f1b469f08bf0d23a9", optional = true }
gpu-raw = { git = "https://github.com/petitstrawberry/Scarlet", rev = "85f0cead4cb4c9add021360f1b469f08bf0d23a9", default-features = false }
sgfx-codegen-virgl = { path = "../sgfx-codegen-virgl" }
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "508acb0989280e3a9fd9052b06b6e9275ce598f0", default-features = false }

[lib]
name = "sgfx_backend_scarlet_virgl"
path = "src/lib.rs"

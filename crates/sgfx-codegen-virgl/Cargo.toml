[package]
name = "sgfx-codegen-virgl"
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/petitstrawberry/sgfx"

[dependencies]
naga = { version = "24", optional = true, features = ["wgsl-in", "spv-in"] }
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "77e64a81115d78fab7c63671c2a6c16aac060c05", default-features = false }

[features]
default = []
programmable = ["dep:naga"]

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in", "spv-out"] }

[lib]
name = "sgfx_codegen_virgl"
path = "src/lib.rs"

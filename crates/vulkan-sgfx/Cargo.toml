[package]
name = "vulkan-sgfx"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Experimental non-conformant headless Vulkan frontend for SGFX"

[lib]
name = "vulkan_sgfx"
crate-type = ["cdylib", "rlib"]

[features]
cube-demo = ["dep:png", "dep:libloading", "dep:framebuffer", "naga/wgsl-in"]

[[bin]]
name = "vulkan-cube"
path = "src/bin/vulkan_cube.rs"
required-features = ["cube-demo"]

[dependencies]
naga = { version = "24", features = ["spv-in", "spv-out"] }
ash = { version = "0.38", default-features = false, features = ["debug", "std"] }
png = { version = "0.18", optional = true }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
libloading = { version = "0.8", optional = true }
sgfx = { path = "../sgfx", default-features = false, features = ["std", "backend-wgpu"] }

[target.'cfg(target_os = "scarlet")'.dependencies]
framebuffer = { git = "https://github.com/petitstrawberry/Scarlet", rev = "85f0cead4cb4c9add021360f1b469f08bf0d23a9", default-features = false, features = ["std"], optional = true }
sgfx = { path = "../sgfx", default-features = false, features = ["std", "backend-scarlet-virgl"] }

[dev-dependencies]
png = "0.18"
naga = { version = "24", features = ["wgsl-in", "spv-out"] }

[target.'cfg(not(target_os = "scarlet"))'.dev-dependencies]
libloading = "0.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }

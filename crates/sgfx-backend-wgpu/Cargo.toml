[package]
name = "sgfx-backend-wgpu"
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/petitstrawberry/sgfx"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
raw-window-handle = "0.6"
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "77e64a81115d78fab7c63671c2a6c16aac060c05", default-features = false }
wgpu = { version = "24", features = ["spirv", "naga-ir"] }
naga = { version = "24", features = ["spv-in", "wgsl-in"] }

[lib]
name = "sgfx_backend_wgpu"
path = "src/lib.rs"

[dev-dependencies]
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "77e64a81115d78fab7c63671c2a6c16aac060c05", default-features = false, features = ["backend-abi"] }
naga = { version = "24", features = ["wgsl-in", "spv-out"] }

[package]
name = "sgfx-backend-wgpu"
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/petitstrawberry/sgfx"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
raw-window-handle = "0.6"
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "2249cc2e4ed09162e08b0398a57f6452d0275a67", default-features = false }
wgpu = { version = "24", features = ["spirv"] }

[lib]
name = "sgfx_backend_wgpu"
path = "src/lib.rs"

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in", "spv-out"] }

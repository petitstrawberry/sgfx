[package]
name = "sgfx"
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/petitstrawberry/sgfx"

[features]
default = [
    "std",
    "backend-wgpu",
    "backend-scarlet-virgl",
    "backend-scarlet-adreno",
    "backend-scarlet-maxwell",
]
std = [
    "sgfx-core/std",
    "gpu-raw?/std",
    "sgfx-backend-scarlet-adreno?/std",
    "sgfx-backend-scarlet-maxwell?/std",
    "sgfx-backend-scarlet-virgl?/std",
]
legacy-scarlet-std = [
    "backend-wgpu",
    "backend-scarlet-virgl",
    "backend-scarlet-adreno",
    "backend-scarlet-maxwell",
    "dep:scarlet-std",
    "gpu-raw?/scarlet-std",
    "sgfx-backend-scarlet-adreno?/scarlet-std",
    "sgfx-backend-scarlet-maxwell?/scarlet-std",
    "sgfx-backend-scarlet-virgl?/scarlet-std",
]
# Compatibility alias for consumers that previously selected Scarlet's
# no_std support directly on the `sgfx` package.
scarlet-std = ["legacy-scarlet-std"]
backend-wgpu = [
    "dep:pollster",
    "dep:raw-window-handle",
    "dep:sgfx-backend-wgpu",
    "dep:wgpu",
]
scarlet-native-api = ["std", "backend-scarlet-virgl"]
backend-scarlet-virgl = ["dep:gpu-raw", "dep:sgfx-backend-scarlet-virgl"]
backend-scarlet-maxwell = ["dep:gpu-raw", "dep:sgfx-backend-scarlet-maxwell"]
backend-scarlet-adreno = ["dep:gpu-raw", "dep:sgfx-backend-scarlet-adreno"]

[dependencies]
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "53f15752f2ac2ee39e4da062133443ee708c1b8b", default-features = false }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }
sgfx-backend-wgpu = { path = "../sgfx-backend-wgpu", optional = true }
wgpu = { version = "24", features = ["spirv"], optional = true }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-std = { git = "https://github.com/petitstrawberry/Scarlet", rev = "8340078937951f6096e6f3273b547665368f70f4", optional = true }
gpu-raw = { git = "https://github.com/petitstrawberry/Scarlet", rev = "8340078937951f6096e6f3273b547665368f70f4", default-features = false, optional = true }
sgfx-backend-scarlet-maxwell = { git = "https://github.com/petitstrawberry/scarlet-project-switch", rev = "a0c94c6fe9d3c53362dd19343e9ef557172a2c88", default-features = false, optional = true }
sgfx-backend-scarlet-adreno = { git = "https://github.com/petitstrawberry/scarlet-project-chromebook.git", rev = "db4ed9b517141ca3245a16a6127b5025d3b2327f", package = "sgfx-backend-scarlet-adreno", default-features = false, optional = true }
sgfx-backend-scarlet-virgl = { path = "../sgfx-backend-scarlet-virgl", default-features = false, optional = true }

# Linux-ABI clients in Scarlet opt into the native GPU transport explicitly.
[target.'cfg(target_os = "linux")'.dependencies]
gpu-raw = { git = "https://github.com/petitstrawberry/Scarlet", rev = "8340078937951f6096e6f3273b547665368f70f4", default-features = false, optional = true }
sgfx-backend-scarlet-virgl = { path = "../sgfx-backend-scarlet-virgl", default-features = false, optional = true }

[lib]
name = "sgfx"
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }

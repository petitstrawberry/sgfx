[package]
name = "sgfx"
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/petitstrawberry/sgfx"

[features]
backend-dynamic = [ "dep:sgfx-backend-abi", "dep:sgfx-backend-loader", "dep:scarlet-os", "dep:gpu-raw"]
default = [
    "std",
    "backend-wgpu",
    "backend-scarlet-virgl",
    "backend-scarlet-adreno",
    "backend-dynamic",
]
std = [
    "sgfx-core/std",
    "sgfx-backend-loader?/std",
    "scarlet-os?/std",
    "gpu-raw?/std",
    "sgfx-backend-scarlet-adreno?/std",
    "sgfx-backend-scarlet-virgl?/std",
    "sgfx-backend-scarlet-virgl-compat?/std",
]
legacy-scarlet-std = [
    "backend-wgpu",
    "backend-scarlet-virgl",
    "backend-scarlet-adreno",
    "backend-dynamic",
    "dep:scarlet-std",
    "sgfx-backend-loader?/legacy-scarlet-std",
    "gpu-raw?/scarlet-std",
    "sgfx-backend-scarlet-adreno?/scarlet-std",
    "sgfx-backend-scarlet-virgl?/scarlet-std",
    "sgfx-backend-scarlet-virgl-compat?/scarlet-std",
]
# Compatibility alias for consumers that previously selected Scarlet's
# no_std support directly on the `sgfx` package.
scarlet-std = ["legacy-scarlet-std"]
backend-wgpu = [
    "dep:pollster",
    "dep:raw-window-handle",
    "dep:sgfx-backend-wgpu",
    "dep:wgpu",
]
scarlet-native-api = ["std", "backend-scarlet-virgl"]
backend-scarlet-virgl = ["backend-dynamic", "dep:gpu-raw", "dep:sgfx-backend-scarlet-virgl-compat"]
# Explicit comparison/compatibility build; native 64-bit production uses the DSO.
backend-scarlet-virgl-static = ["dep:gpu-raw", "dep:sgfx-backend-scarlet-virgl", "dep:sgfx-backend-scarlet-virgl-compat"]
backend-scarlet-adreno = ["dep:gpu-raw", "dep:sgfx-backend-scarlet-adreno"]

[dependencies]
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "040dbb5cf42b75489504e1765183d37f6131f54c", default-features = false }

[target.'cfg(target_pointer_width = "64")'.dependencies]
sgfx-backend-abi = { git = "https://github.com/petitstrawberry/sgfx", rev = "040dbb5cf42b75489504e1765183d37f6131f54c", optional = true }
sgfx-backend-loader = { path = "../sgfx-backend-loader", default-features = false, optional = true }
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "040dbb5cf42b75489504e1765183d37f6131f54c", default-features = false, features = ["backend-abi"] }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }
sgfx-backend-wgpu = { path = "../sgfx-backend-wgpu", optional = true }
wgpu = { version = "24", features = ["spirv"], optional = true }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "b3d2a55740a3d2ca49daad0ec7baba233f706f7a", default-features = false, optional = true }
scarlet-std = { git = "https://github.com/petitstrawberry/Scarlet", rev = "b3d2a55740a3d2ca49daad0ec7baba233f706f7a", optional = true }
gpu-raw = { git = "https://github.com/petitstrawberry/Scarlet", rev = "b3d2a55740a3d2ca49daad0ec7baba233f706f7a", default-features = false, optional = true }
sgfx-backend-scarlet-adreno = { git = "https://github.com/petitstrawberry/scarlet-project-chromebook.git", rev = "ed98fe5c73d476cde26d057e677acbfaa4defd77", package = "sgfx-backend-scarlet-adreno", default-features = false, optional = true }

# Scarlet Linux-ABI clients use the native GPU transport on AArch64.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
gpu-raw = { git = "https://github.com/petitstrawberry/Scarlet", rev = "b3d2a55740a3d2ca49daad0ec7baba233f706f7a", default-features = false, optional = true }

[lib]
name = "sgfx"
path = "src/lib.rs"

[[example]]
name = "deferred_lighting"
required-features = ["backend-wgpu"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }

[target.'cfg(all(target_os = "scarlet", target_pointer_width = "64"))'.dependencies]
sgfx-backend-scarlet-virgl = { path = "../sgfx-backend-scarlet-virgl", default-features = false, optional = true }

# ELF32 and Linux-ABI clients retain their explicit compatibility backend.
[target.'cfg(any(all(target_os = "scarlet", target_pointer_width = "32"), all(target_os = "linux", target_arch = "aarch64")))'.dependencies]
sgfx-backend-scarlet-virgl-compat = { path = "../sgfx-backend-scarlet-virgl-compat", default-features = false, optional = true }

[[example]]
name = "legacy_dynamic_smoke"
required-features = ["legacy-scarlet-std"]

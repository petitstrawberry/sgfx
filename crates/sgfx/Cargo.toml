[package]
name = "sgfx"
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/petitstrawberry/sgfx"

[features]
backend-dynamic = [ "dep:sgfx-backend-abi", "dep:sgfx-backend-loader", "dep:scarlet-os", "dep:gpu-raw"]
default = [
    "std",
    "backend-wgpu",
    "backend-dynamic",
]
std = [
    "sgfx-core/std",
    "sgfx-backend-loader?/std",
    "scarlet-os?/std",
    "gpu-raw?/std",
]
legacy-scarlet-std = [
    "backend-wgpu",
    "backend-dynamic",
    "dep:scarlet-std",
    "sgfx-backend-loader?/legacy-scarlet-std",
    "gpu-raw?/scarlet-std",
]
# Compatibility alias for consumers that previously selected Scarlet's
# no_std support directly on the `sgfx` package.
scarlet-std = ["legacy-scarlet-std"]
backend-wgpu = [
    "dep:pollster",
    "dep:raw-window-handle",
    "dep:sgfx-backend-wgpu",
    "dep:wgpu",
]
scarlet-native-api = ["std", "backend-dynamic"]

[dependencies]
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "77e64a81115d78fab7c63671c2a6c16aac060c05", default-features = false }

[target.'cfg(target_pointer_width = "64")'.dependencies]
sgfx-backend-abi = { path = "../sgfx-backend-abi", optional = true }
sgfx-backend-loader = { path = "../sgfx-backend-loader", default-features = false, optional = true }
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "77e64a81115d78fab7c63671c2a6c16aac060c05", default-features = false, features = ["backend-abi"] }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }
sgfx-backend-wgpu = { path = "../sgfx-backend-wgpu", optional = true }
wgpu = { version = "24", features = ["spirv"], optional = true }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "5d0fe3ac8c97289a28599bac22fca4ac26a5f9ca", default-features = false, optional = true }
scarlet-std = { git = "https://github.com/petitstrawberry/Scarlet", rev = "5d0fe3ac8c97289a28599bac22fca4ac26a5f9ca", optional = true }
gpu-raw = { git = "https://github.com/petitstrawberry/Scarlet", rev = "5d0fe3ac8c97289a28599bac22fca4ac26a5f9ca", default-features = false, optional = true }

# Scarlet Linux-ABI clients use the native GPU transport on AArch64.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
gpu-raw = { git = "https://github.com/petitstrawberry/Scarlet", rev = "5d0fe3ac8c97289a28599bac22fca4ac26a5f9ca", default-features = false, optional = true }
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "5d0fe3ac8c97289a28599bac22fca4ac26a5f9ca", default-features = false, optional = true }

[lib]
name = "sgfx"
path = "src/lib.rs"

[[example]]
name = "deferred_lighting"
required-features = ["backend-wgpu"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }

[[example]]
name = "legacy_dynamic_smoke"
required-features = ["legacy-scarlet-std"]

[package]
name = "sgfx"
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/petitstrawberry/sgfx"

[features]
default = [
    "std",
    "backend-wgpu",
    "backend-scarlet-virgl",
    "backend-scarlet-adreno",
    "backend-scarlet-maxwell",
]
std = [
    "sgfx-core/std",
    "gpu-raw?/std",
    "sgfx-backend-scarlet-adreno?/std",
    "sgfx-backend-scarlet-maxwell?/std",
    "sgfx-backend-scarlet-virgl?/std",
]
legacy-scarlet-std = [
    "backend-wgpu",
    "backend-scarlet-virgl",
    "backend-scarlet-adreno",
    "backend-scarlet-maxwell",
    "dep:scarlet-std",
    "gpu-raw?/scarlet-std",
    "sgfx-backend-scarlet-adreno?/scarlet-std",
    "sgfx-backend-scarlet-maxwell?/scarlet-std",
    "sgfx-backend-scarlet-virgl?/scarlet-std",
]
# Compatibility alias for consumers that previously selected Scarlet's
# no_std support directly on the `sgfx` package.
scarlet-std = ["legacy-scarlet-std"]
backend-wgpu = [
    "dep:pollster",
    "dep:raw-window-handle",
    "dep:sgfx-backend-wgpu",
    "dep:wgpu",
]
scarlet-native-api = ["std", "backend-scarlet-virgl"]
backend-scarlet-virgl = ["dep:gpu-raw", "dep:sgfx-backend-scarlet-virgl"]
backend-scarlet-maxwell = ["dep:gpu-raw", "dep:sgfx-backend-scarlet-maxwell"]
backend-scarlet-adreno = ["dep:gpu-raw", "dep:sgfx-backend-scarlet-adreno"]

[dependencies]
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "34a47c701fa0d4761f63f3d841c7d312cea45236", default-features = false }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }
sgfx-backend-wgpu = { path = "../sgfx-backend-wgpu", optional = true }
wgpu = { version = "24", features = ["spirv"], optional = true }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-std = { git = "https://github.com/petitstrawberry/Scarlet", rev = "b46f0e19f04db5b8a133aea28dac2652fa55565a", optional = true }
gpu-raw = { git = "https://github.com/petitstrawberry/Scarlet", rev = "b46f0e19f04db5b8a133aea28dac2652fa55565a", default-features = false, optional = true }
sgfx-backend-scarlet-maxwell = { git = "https://github.com/petitstrawberry/scarlet-project-switch", rev = "2f08e7608621039ce265e222fd4e95f618917c9d", default-features = false, optional = true }
sgfx-backend-scarlet-adreno = { git = "https://github.com/petitstrawberry/scarlet-project-chromebook.git", rev = "fb71b8bcc1db5cb384cdefbb82da3d4e15c0b8d0", package = "sgfx-backend-scarlet-adreno", default-features = false, optional = true }
sgfx-backend-scarlet-virgl = { path = "../sgfx-backend-scarlet-virgl", default-features = false, optional = true }

# Scarlet Linux-ABI clients use the native GPU transport on AArch64.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
gpu-raw = { git = "https://github.com/petitstrawberry/Scarlet", rev = "b46f0e19f04db5b8a133aea28dac2652fa55565a", default-features = false, optional = true }
sgfx-backend-scarlet-virgl = { path = "../sgfx-backend-scarlet-virgl", default-features = false, optional = true }

[lib]
name = "sgfx"
path = "src/lib.rs"

[[example]]
name = "deferred_lighting"
required-features = ["backend-wgpu"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }

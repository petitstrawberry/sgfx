[package]
name = "sgfx-backend-loader"
version = "1.0.0"
edition = "2024"
license = "MIT"

[features]
default = ["std"]
std = []
legacy-scarlet-std = ["dep:scarlet-std"]

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-std = { git = "https://github.com/petitstrawberry/Scarlet", rev = "b229d6d007fbdf8e3b9a130c3feeaf94ee8019e9", optional = true }

[dependencies]
sgfx-backend-abi = { path = "../sgfx-backend-abi" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }

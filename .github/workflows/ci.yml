name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCARLET_TOOLCHAIN: github:petitstrawberry/scarlet-rust-nix/2b4ddd555389a8c53806bbc2586440b2662c38dd#scarlet-rust-toolchain

jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [scarlet, upstream]
    env:
      RUSTUP_TOOLCHAIN: nightly-2025-12-31
      CARGO_TARGET_DIR: target/${{ matrix.toolchain }}-host
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        if: matrix.toolchain == 'scarlet'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://scarlet-rust-toolchain.cachix.org
            extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=
      - name: Install the pinned Scarlet Rust toolchain
        if: matrix.toolchain == 'scarlet'
        run: |
          scarlet_toolchain_path="$(nix build "${SCARLET_TOOLCHAIN}^out" --no-link --print-out-paths)"
          echo "$scarlet_toolchain_path/bin" >> "$GITHUB_PATH"
      - name: Install upstream Rust for portability checks
        if: matrix.toolchain == 'upstream'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Show the selected compiler
        run: |
          rustc -vV
          rustc --print sysroot
      - name: Check formatting
        # Invoke the selected toolchain's binary directly: `cargo fmt` can
        # otherwise dispatch to a rustup proxy instead of the Nix toolchain.
        run: cargo-fmt fmt --all --check
      - name: Check SGFX core source identity
        # An unqualified package name is ambiguous (and fails) if the graph
        # contains multiple sgfx-core sources, even at the same version/SHA.
        run: cargo tree --locked -p sgfx --invert sgfx-core
      - name: Test portable crates
        run: |
          cargo test --locked -p sgfx-core
          cargo test --locked -p sgfx-codegen-virgl
          cargo test --locked -p sgfx-backend-wgpu
          cargo test --locked -p sgfx
          cargo test --locked -p vulkan-sgfx
      - name: Build the experimental Vulkan ICD and examples
        run: cargo build --locked -p vulkan-sgfx --examples
      - name: Test native dispatch policy without GPU syscalls
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          rustc --edition=2024 --test crates/sgfx-backend-scarlet-virgl/src/scheduler.rs -o "$CARGO_TARGET_DIR/native-scheduler-tests"
          "$CARGO_TARGET_DIR/native-scheduler-tests"
          rustc --edition=2024 --test crates/sgfx-backend-scarlet-virgl/src/packets.rs -o "$CARGO_TARGET_DIR/native-packet-tests"
          "$CARGO_TARGET_DIR/native-packet-tests"
      - name: Lint portable crates
        run: cargo-clippy clippy --locked -p sgfx-core -p sgfx-codegen-virgl -p sgfx-backend-wgpu -p sgfx -p vulkan-sgfx --all-targets --no-deps -- -D warnings
      - name: Test and lint facade feature boundaries
        run: |
          cargo test --locked -p sgfx --no-default-features
          cargo test --locked -p sgfx --no-default-features --features backend-wgpu
          cargo-clippy clippy --locked -p sgfx --no-default-features --all-targets --no-deps -- -D warnings
          cargo-clippy clippy --locked -p sgfx --no-default-features --features backend-wgpu --all-targets --no-deps -- -D warnings
      - name: Check public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --no-deps -p sgfx-core -p sgfx-codegen-virgl -p sgfx-backend-wgpu -p sgfx -p vulkan-sgfx
          cargo doc --locked --no-deps -p sgfx --no-default-features

  scarlet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [riscv64gc-unknown-scarlet, aarch64-unknown-scarlet]
    env:
      CARGO_TARGET_DIR: target/scarlet-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://scarlet-rust-toolchain.cachix.org
            extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=
      - name: Check SGFX core source identity
        run: nix shell "$SCARLET_TOOLCHAIN" --command cargo tree --locked -p sgfx --target '${{ matrix.target }}' --invert sgfx-core
      - name: Check std-enabled Scarlet target
        run: nix shell "$SCARLET_TOOLCHAIN" --command cargo check --locked -p sgfx --target '${{ matrix.target }}'
      - name: Lint std-enabled Scarlet target
        run: nix shell "$SCARLET_TOOLCHAIN" --command cargo-clippy clippy --locked -p sgfx --target '${{ matrix.target }}' --no-deps -- -D warnings
      - name: Check backend-neutral facade without a runtime
        run: |
          nix shell "$SCARLET_TOOLCHAIN" --command cargo check --locked -p sgfx --target '${{ matrix.target }}' --no-default-features
          nix shell "$SCARLET_TOOLCHAIN" --command cargo-clippy clippy --locked -p sgfx --target '${{ matrix.target }}' --no-default-features --no-deps -- -D warnings
      - name: Check native public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: nix shell "$SCARLET_TOOLCHAIN" --command cargo doc --locked --no-deps -p sgfx -p sgfx-backend-scarlet-virgl --target '${{ matrix.target }}'

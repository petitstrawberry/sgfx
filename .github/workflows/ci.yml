name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCARLET_TOOLCHAIN: github:petitstrawberry/scarlet-rust-nix/074b722ac3c0d69daa8d4560996e23474c373d7c#scarlet-rust-toolchain

jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [scarlet, upstream]
    env:
      RUSTUP_TOOLCHAIN: nightly-2025-12-31
      CARGO_TARGET_DIR: target/${{ matrix.toolchain }}-host
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        if: matrix.toolchain == 'scarlet'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://scarlet-rust-toolchain.cachix.org
            extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=
      - name: Install the pinned Scarlet Rust toolchain
        if: matrix.toolchain == 'scarlet'
        run: |
          scarlet_toolchain_path="$(nix build "${SCARLET_TOOLCHAIN}^out" --no-link --print-out-paths)"
          echo "$scarlet_toolchain_path/bin" >> "$GITHUB_PATH"
      - name: Install upstream Rust for portability checks
        if: matrix.toolchain == 'upstream'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Show the selected compiler
        run: |
          rustc -vV
          rustc --print sysroot
      - name: Check formatting
        # Invoke the selected toolchain's binary directly: `cargo fmt` can
        # otherwise dispatch to a rustup proxy instead of the Nix toolchain.
        run: cargo-fmt fmt --all --check
      - name: Check SGFX core source identity
        # An unqualified package name is ambiguous (and fails) if the graph
        # contains multiple sgfx-core sources, even at the same version/SHA.
        run: cargo tree --locked -p sgfx --invert sgfx-core
      - name: Test portable crates
        run: |
          cargo test --locked -p sgfx-core
          cargo test --locked -p sgfx-core --features backend-abi
          cargo test --locked -p sgfx-backend-abi -p sgfx-backend-loader
          cargo test --locked -p sgfx-codegen-virgl
          cargo test --locked -p sgfx-backend-wgpu
          cargo test --locked -p sgfx
          cargo test --locked -p vulkan-sgfx
      - name: Build the experimental Vulkan ICD and examples
        run: cargo build --locked -p vulkan-sgfx --examples
      - name: Test native dispatch policy without GPU syscalls
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          rustc --edition=2024 --test crates/sgfx-backend-scarlet-virgl/src/scheduler.rs -o "$CARGO_TARGET_DIR/native-scheduler-tests"
          "$CARGO_TARGET_DIR/native-scheduler-tests"
          rustc --edition=2024 --test crates/sgfx-backend-scarlet-virgl/src/packets.rs -o "$CARGO_TARGET_DIR/native-packet-tests"
          "$CARGO_TARGET_DIR/native-packet-tests"
      - name: Lint portable crates
        run: |
          cargo-clippy clippy --locked --manifest-path crates/sgfx-core/Cargo.toml --all-targets --no-deps -- -D warnings
          cargo-clippy clippy --locked -p sgfx-core -p sgfx-backend-loader --features sgfx-core/backend-abi --all-targets --no-deps -- -D warnings
          cargo-clippy clippy --locked -p sgfx-codegen-virgl -p sgfx-backend-wgpu -p sgfx -p vulkan-sgfx --all-targets --no-deps -- -D warnings
      - name: Test and lint facade feature boundaries
        run: |
          cargo test --locked -p sgfx --no-default-features
          cargo test --locked -p sgfx --no-default-features --features backend-wgpu
          cargo test --locked -p sgfx --no-default-features --features std,backend-dynamic,backend-wgpu
          cargo test --locked -p sgfx --no-default-features --features std,backend-dynamic
          cargo test --locked -p sgfx --no-default-features --features std,backend-dynamic,backend-scarlet-virgl-static
          cargo test --locked -p sgfx --no-default-features --features std,backend-scarlet-virgl-static
          cargo-clippy clippy --locked -p sgfx --no-default-features --all-targets --no-deps -- -D warnings
          cargo-clippy clippy --locked -p sgfx --no-default-features --features backend-wgpu --all-targets --no-deps -- -D warnings
      - name: Check public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --no-deps --manifest-path crates/sgfx-core/Cargo.toml
          cargo doc --locked --no-deps -p sgfx-codegen-virgl -p sgfx-backend-wgpu -p sgfx -p vulkan-sgfx
          cargo doc --locked --no-deps -p sgfx --no-default-features

  scarlet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [riscv64gc-unknown-scarlet, aarch64-unknown-scarlet]
    env:
      CARGO_TARGET_DIR: target/scarlet-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://scarlet-rust-toolchain.cachix.org
            extra-trusted-public-keys = scarlet-rust-toolchain.cachix.org-1:p+coBExi0nNTIvWF/oM9H9/1/GhwFtqGZ2Vs+4pYl6o=
      - name: Install the pinned Scarlet Rust toolchain
        run: |
          scarlet_toolchain_path="$(nix build "${SCARLET_TOOLCHAIN}^out" --no-link --print-out-paths)"
          echo "$scarlet_toolchain_path/bin" >> "$GITHUB_PATH"
      - name: Check SGFX core source identity
        run: cargo tree --locked -p sgfx --target '${{ matrix.target }}' --invert sgfx-core
      - name: Check std-enabled Scarlet target
        run: cargo check --locked -p sgfx --target '${{ matrix.target }}'
      - name: Check generic discovery and static VirGL feature boundaries
        run: |
          cargo check --locked -p sgfx --target '${{ matrix.target }}' --no-default-features --features std,backend-dynamic
          cargo check --locked -p sgfx --target '${{ matrix.target }}' --no-default-features --features std,backend-scarlet-virgl-static
          cargo check --locked -p sgfx --target '${{ matrix.target }}' --no-default-features --features std,backend-dynamic,backend-scarlet-virgl-static
          cargo tree --locked -p sgfx --target '${{ matrix.target }}' --prefix none > "$CARGO_TARGET_DIR/default-tree.txt"
          cargo tree --locked -p sgfx --target '${{ matrix.target }}' --no-default-features --features std,backend-dynamic --prefix none > "$CARGO_TARGET_DIR/dynamic-tree.txt"
          cargo tree --locked -p sgfx --target '${{ matrix.target }}' --no-default-features --features std,backend-dynamic --edges normal --depth 1 --prefix none > "$CARGO_TARGET_DIR/dynamic-direct-tree.txt"
          cargo tree --locked -p sgfx --target '${{ matrix.target }}' --no-default-features --features std,backend-scarlet-virgl-static --prefix none > "$CARGO_TARGET_DIR/virgl-static-tree.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          target = Path(os.environ['CARGO_TARGET_DIR'])
          for name in ('default-tree.txt', 'dynamic-tree.txt'):
              tree = (target / name).read_text()
              assert 'sgfx-backend-loader v' in tree, name
          direct_dependencies = {
              line.split()[0]
              for line in (target / 'dynamic-direct-tree.txt').read_text().splitlines()
              if line.strip()
          }
          assert direct_dependencies == {
              'sgfx', 'sgfx-core', 'sgfx-backend-abi', 'sgfx-backend-loader',
              'gpu-raw', 'scarlet-os',
          }, direct_dependencies
          assert 'sgfx-backend-loader v' not in (target / 'virgl-static-tree.txt').read_text()
          PY
      - name: Lint std-enabled Scarlet target
        run: cargo-clippy clippy --locked -p sgfx --target '${{ matrix.target }}' --no-deps -- -D warnings
      - name: Check backend-neutral facade without a runtime
        run: |
          cargo check --locked -p sgfx --target '${{ matrix.target }}' --no-default-features
          cargo-clippy clippy --locked -p sgfx --target '${{ matrix.target }}' --no-default-features --no-deps -- -D warnings
      - name: Check the dynamic facade and VirGL plugin
        # The pinned native toolchain supports cdylibs and DSO-safe std TLS.
        run: cargo-clippy clippy --locked -p sgfx -p sgfx-backend-scarlet-virgl-plugin --target '${{ matrix.target }}' --no-default-features --features sgfx/std,sgfx/backend-dynamic --no-deps -- -D warnings
      - name: Link the native VirGL plugin and verify its Scarlet OSABI
        env:
          RUSTFLAGS: -Zdefault-visibility=hidden
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        run: |
          cargo rustc --locked --release -p sgfx-backend-scarlet-virgl-plugin --lib --target '${{ matrix.target }}' -- \
            -C link-arg=--hash-style=both -C link-arg=--entry=0 -C link-arg=--exclude-libs=ALL \
            -C link-arg=-soname -C link-arg=libsgfx_scarlet_virgl.so -C link-arg=-z -C link-arg=defs
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['CARGO_TARGET_DIR']) / '${{ matrix.target }}' / 'release/libsgfx_scarlet_virgl.so'
          header = path.read_bytes()[:20]
          assert header[:8] == b'\x7fELF\x02\x01\x01\x53', header
          assert int.from_bytes(header[16:18], 'little') == 3, header
          PY
      - name: Check native public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps -p sgfx -p sgfx-backend-scarlet-virgl --target '${{ matrix.target }}'
